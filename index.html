<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO PHARAOH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1420; color:#efe6cf; font-family:'Courier New',monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { text-align:center; padding:26px 16px 4px; }
  h1 { letter-spacing:.3em; font-size:clamp(22px,4.5vw,36px); color:#e8c15a; text-shadow:0 0 20px rgba(232,193,90,.25); }
  .sub { color:#8d94a8; font-size:11.5px; letter-spacing:.22em; margin-top:6px; }
  #hud { display:flex; gap:26px; margin:14px 0; font-size:13.5px; color:#9aa4b5; flex-wrap:wrap; justify-content:center; }
  #hud .v { color:#e8c15a; font-weight:bold; }
  #board { display:grid; gap:10px; width:min(520px,92vw); margin:0 auto 30px; }
  .card { aspect-ratio:1; perspective:600px; cursor:pointer; background:none; border:none; padding:0; }
  .card .inner { position:relative; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; }
  .card.flip .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:8px; backface-visibility:hidden; font-size:clamp(22px,6vw,38px); }
  .back { background:linear-gradient(145deg,#1c2a42,#141e30); border:1px solid #2c3c58; color:#3c4c6a; }
  .back::after { content:'\2625 '; font-size:.9em; }
  .front { background:linear-gradient(145deg,#f2dfae,#e0c37c); border:1px solid #c8a855; transform:rotateY(180deg); color:#2a2210; }
  .card.matched .front { background:linear-gradient(145deg,#c9a94e,#b08d36); box-shadow:0 0 18px rgba(232,193,90,.45); }
  .card.matched { cursor:default; }
  .overlay { position:fixed; inset:0; background:rgba(8,12,20,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:10; padding:24px; }
  .hidden { display:none !important; }
  .overlay h1 { margin-bottom:12px; }
  .overlay p { max-width:480px; line-height:1.9; color:#b8bfce; font-size:14px; margin-bottom:28px; }
  .overlay b { color:#e8c15a; }
  .btn { font-family:inherit; font-size:15px; letter-spacing:.2em; padding:14px 38px; background:transparent; color:#e8c15a; border:2px solid #e8c15a; border-radius:3px; cursor:pointer; }
  .btn:hover { background:#e8c15a; color:#0d1420; }
</style>
</head>
<body>
<header>
  <h1>PHOTO PHARAOH</h1>
  <div class="sub">MATCH THE RELICS. FEWER MOVES, MORE GLORY.</div>
</header>
<div id="hud">
  <span>MOVES <span class="v" id="moves">0</span></span>
  <span>MATCHED <span class="v" id="pairs">0</span>/8</span>
  <span>BEST <span class="v" id="best">-</span></span>
</div>
<div id="board"></div>

<div class="overlay" id="winScreen">
  <h1>THE TOMB IS YOURS</h1>
  <p id="winText"></p>
  <button class="btn" id="againBtn">RAID AGAIN</button>
</div>

<script>
(function(){
"use strict";
const GLYPHS=['\u{131A3}','\u{13080}','\u{130A0}','\u{131CB}','\u{133BC}','\u{130ED}','\u{131F3}','\u{132F9}'];
const FALLBACK=['𓂀','☥','𓆣','𓁹','♛','𓃭','⚱','𓇳'];
let deck=[], first=null, lock=false, moves=0, matched=0;
let best=+(localStorage.getItem('pharaoh-best')||0);
const board=document.getElementById('board');

let AC=null;
function tone(f,type,a,p,d){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); o.start(t); o.stop(t+a+d+.05);}catch(e){} }
function flipSnd(){ tone(440,'triangle',.01,.1,.08); }
function matchSnd(){ tone(660,'triangle',.01,.14,.15); setTimeout(()=>tone(990,'triangle',.01,.14,.25),90); }
function noSnd(){ tone(220,'sine',.01,.1,.2); }
function winSnd(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'triangle',.02,.16,.4),i*140)); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function start(){
  deck=shuffle([...GLYPHS,...GLYPHS].map((g,i)=>({g, id:i})));
  first=null; lock=false; moves=0; matched=0;
  document.getElementById('winScreen').classList.add('hidden');
  board.innerHTML='';
  board.style.gridTemplateColumns='repeat(4,1fr)';
  deck.forEach(c=>{
    const b=document.createElement('button');
    b.className='card'; b.setAttribute('aria-label','card');
    b.innerHTML='<div class="inner"><div class="face back"></div><div class="face front">'+c.g+'</div></div>';
    b.addEventListener('click',()=>flip(b,c));
    board.appendChild(b);
  });
  hud();
}
function hud(){
  document.getElementById('moves').textContent=moves;
  document.getElementById('pairs').textContent=matched;
  document.getElementById('best').textContent=best||'-';
}
function flip(el,card){
  if(lock || el.classList.contains('flip') || el.classList.contains('matched')) return;
  flipSnd();
  el.classList.add('flip');
  if(!first){ first={el,card}; return; }
  moves++;
  if(first.card.g===card.g){
    el.classList.add('matched'); first.el.classList.add('matched');
    matched++; matchSnd(); first=null;
    if(matched===GLYPHS.length){
      setTimeout(()=>{
        if(!best||moves<best){ best=moves; localStorage.setItem('pharaoh-best',best); }
        document.getElementById('winText').innerHTML='All 8 relics matched in <b>'+moves+' moves</b>.<br>'+(moves<=12?'A perfect raid. The pharaohs applaud.':moves<=20?'A respectable plunder.':'Messy, but the gold spends the same.');
        document.getElementById('winScreen').classList.remove('hidden');
        winSnd(); hud();
      },600);
    }
  } else {
    noSnd();
    const f=first; first=null; lock=true;
    setTimeout(()=>{ f.el.classList.remove('flip'); el.classList.remove('flip'); lock=false; }, 750);
  }
  hud();
}
document.getElementById('againBtn').addEventListener('click',start);
start();
})();
</script>
</body>
</html>
